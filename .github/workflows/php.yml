name: PHP package checks

on:
  push:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4.1', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, intl, mbstring, pdo_sqlite
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --strict --no-check-publish --no-interaction

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Check PHP syntax
        run: composer lint

      - name: Run tests
        run: composer test --no-interaction
